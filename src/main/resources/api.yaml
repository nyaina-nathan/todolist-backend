openapi: 3.0.3
info:
  title: Todo API
  description: |
    REST API for managing todos and their nested events, with JWT-based
    authentication. Todos and events are scoped to the authenticated user.
  version: 0.0.1
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Registration, login and account management
  - name: Todos
    description: CRUD operations on the authenticated user's todos
  - name: Events
    description: Events belonging to a todo
  - name: Stats
    description: Aggregated statistics for the authenticated user
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: >-
            Account created. Issues the `access_token` and `refresh_token`
            as httpOnly cookies.
          headers:
            Set-Cookie:
              description: >-
                Sets the `access_token` and `refresh_token` httpOnly,
                secure cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Authenticated. Issues the `access_token` and `refresh_token`
            as httpOnly cookies.
          headers:
            Set-Cookie:
              description: >-
                Sets the `access_token` and `refresh_token` httpOnly,
                secure cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token in cookies for a new token pair
      operationId: refresh
      security: []
      responses:
        '200':
          description: Token pair refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and revoke the user's refresh tokens
      description: >-
        Deletes all persisted refresh tokens for the user and clears the
        `access_token` and `refresh_token` cookies. The endpoint is tolerant:
        it works with a valid access token, with only a refresh cookie, or
        with no credentials at all. The access token remains valid until it
        expires; only the refresh tokens are revoked server-side.
      operationId: logout
      security: []
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie:
              description: Clears the `access_token` and `refresh_token` cookies.
              schema:
                type: string
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Auth]
      summary: Delete the authenticated user's account
      operationId: deleteCurrentUser
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /todos:
    get:
      tags: [Todos]
      summary: List the authenticated user's todos
      operationId: listTodos
      parameters:
        - name: isDone
          in: query
          required: false
          description: Filter by completion status
          schema:
            type: boolean
        - name: title
          in: query
          required: false
          description: >-
            Case-insensitive partial match on the todo title (contains,
            not exact).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
      responses:
        '200':
          description: Paginated list of todos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Todos]
      summary: Create a todo
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreateRequest'
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /todos/{todoId}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [Todos]
      summary: Get a todo by id
      operationId: getTodo
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Todos]
      summary: Partially update a todo
      operationId: updateTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdateRequest'
      responses:
        '200':
          description: Todo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Todos]
      summary: Delete a todo
      operationId: deleteTodo
      responses:
        '204':
          description: Todo deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /todos/{todoId}/events:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [Events]
      summary: List the events of a todo
      operationId: listTodoEvents
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Events]
      summary: Create an event nested under a todo
      operationId: createTodoEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The event's time range overlaps an existing event of the
            authenticated user. The conflicting event is included in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events:
    get:
      tags: [Events]
      summary: List all events of the authenticated user
      operationId: listEvents
      parameters:
        - name: from
          in: query
          required: false
          description: Include events starting on or after this instant
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Include events starting on or before this instant
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
      responses:
        '200':
          description: Paginated list of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get an event by id
      operationId: getEvent
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Events]
      summary: Partially update an event
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The event's resulting time range overlaps another event of the
            authenticated user. The conflicting event is included in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Events]
      summary: Delete an event
      operationId: deleteEvent
      responses:
        '204':
          description: Event deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /stats:
    get:
      tags: [Stats]
      summary: Get aggregated statistics for the authenticated user
      description: >-
        Returns the number of todos that are not done yet, the number of
        events starting in the next 7 days together with their total length,
        and the not-done todo with the closest future deadline.
      operationId: getStats
      responses:
        '200':
          description: Aggregated statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TodoId:
      name: todoId
      in: path
      required: true
      description: Todo identifier
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      description: Event identifier
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not allowed to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    User:
      type: object
      required: [id, email, username, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 255
        username:
          type: string
          maxLength: 255
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        username:
          type: string
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        user:
          $ref: '#/components/schemas/User'
    PageMeta:
      type: object
      required: [page, perPage, total, totalPage]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        perPage:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int64
        totalPage:
          type: integer
          format: int32
    TodoPage:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/PageMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
    Todo:
      type: object
      required: [id, userId, title, done, createdAt, dueDate]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        done:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
          readOnly: true
        dueDate:
          type: string
          format: date-time
    TodoCreateRequest:
      type: object
      required: [title, dueDate]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date-time
    TodoUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        done:
          type: boolean
        dueDate:
          type: string
          format: date-time
    EventPage:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/PageMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    Event:
      type: object
      required: [id, todoId, title, startTime, endTime]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        todoId:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    EventCreateRequest:
      type: object
      required: [title, startTime, endTime]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    EventUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    StatsResponse:
      type: object
      required: [undoneTodoCount, upcomingEventCount, upcomingEventsTotalLength]
      properties:
        undoneTodoCount:
          type: integer
          format: int64
          description: Number of todos that are not done yet
        upcomingEventCount:
          type: integer
          format: int64
          description: Number of events starting in the next 7 days
        upcomingEventsTotalLength:
          type: string
          format: duration
          description: >-
            Total length of the upcoming events as an ISO-8601 duration
            (for example `PT2H30M`, or `PT0S` when there are none).
        closestDeadlineTodo:
          description: >-
            The not-done todo with the closest future deadline, or null when
            there is none.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Todo'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        details:
          type: array
          items:
            type: string
        event:
          description: >-
            Present on `409 Conflict` responses when an event time range
            overlaps an existing event.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Event'
